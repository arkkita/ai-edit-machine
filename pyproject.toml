[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-edit-machine"
version = "0.0.0"
description = "Milestone 1 research worker and provider-independent contracts for AI Edit Machine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
worker-build = [
  "pefile==2024.8.26",
  "pyinstaller==6.22.0",
  "pyinstaller-hooks-contrib==2026.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
